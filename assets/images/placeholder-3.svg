<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e05" />
      <stop offset="50%" stop-color="#351a08" />
      <stop offset="100%" stop-color="#0c0502" />
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8c5810" />
    </linearGradient>
    <radialGradient id="sunGlow3" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad3)" />
  <circle cx="600" cy="360" r="320" fill="url(#sunGlow3)" />

  <rect x="25" y="25" width="1150" height="750" fill="none" stroke="url(#goldGrad3)" stroke-width="2" rx="16" />
  <rect x="35" y="35" width="1130" height="730" fill="none" stroke="#d4af37" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="6,4" rx="12" />

  <!-- Kodanda Bow and Arrow Emblem -->
  <g transform="translate(600, 310)">
    <!-- Aura Rays -->
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#goldGrad3)" stroke-width="1.5" stroke-dasharray="5,6" opacity="0.6"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#goldGrad3)" stroke-width="1" opacity="0.4"/>
    
    <!-- Bow -->
    <path d="M-80 -120 Q30 0 -80 120" fill="none" stroke="url(#goldGrad3)" stroke-width="8" stroke-linecap="round" />
    <!-- Bow string -->
    <line x1="-80" y1="-120" x2="-80" y2="120" stroke="#f3d4a0" stroke-width="2" stroke-opacity="0.8" />
    
    <!-- Arrow -->
    <line x1="-120" y1="0" x2="110" y2="0" stroke="url(#goldGrad3)" stroke-width="5" stroke-linecap="round" />
    <!-- Arrow Head -->
    <polygon points="135,0 100,-16 108,0 100,16" fill="url(#goldGrad3)" />
    <!-- Arrow Fletching -->
    <path d="M-120 0 L-138 -14 M-120 0 L-138 14 M-110 0 L-128 -14 M-110 0 L-128 14" stroke="url(#goldGrad3)" stroke-width="3" stroke-linecap="round" />
  </g>

  <text x="600" y="470" text-anchor="middle" font-family="'Rozha One', 'Georgia', serif" font-size="36" fill="url(#goldGrad3)" letter-spacing="4">
    धनुर्धारी मर्यादा पुरुषोत्तम
  </text>
  <text x="600" y="520" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="20" fill="#f3d4a0" letter-spacing="3" opacity="0.9">
    KODANDA DHANUSH • DIVINE ARCHER OF DHARMA
  </text>

  <g transform="translate(600, 620)">
    <rect x="-240" y="-30" width="480" height="60" rx="30" fill="#2d170a" stroke="url(#goldGrad3)" stroke-width="1.5" opacity="0.9" />
    <text x="0" y="6" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="16" fill="#ffd97d" font-weight="500">
      📷 Image Placeholder 3 • Replace with assets/images/gallery-3.jpg
    </text>
  </g>
</svg>
